[workspace]
resolver = "2"
members = [
  "crates/codex-plus-core",
  "crates/codex-plus-data",
  "apps/codex-plus-launcher",
  "crates/codex-plus-app",
  "crates/codex-plus-app/sherpa-onnx-gnu-shim",
  "crates/codex-plus-devkit",
  "crates/claude-patcher-rs",
  "crates/codex-wechat-rs",
  "crates/remote-control-rs/remote-control-p0",
  "crates/renderer-inject-rs",
  "crates/manager-models/manager-common-rs",
  "crates/manager-models/manager-core-rs",
  "crates/canvas-wasm/canvas-common-rs",
  "crates/canvas-wasm/canvas-core-rs",
  "crates/share-site-rs",
  "crates/rice-maid-pet-rs",
]
# Default `cargo build` / `cargo test` targets the standalone Pure-Rust desktop app,
# devkit, WASM cores, and satellite CLIs. Core/Data/Launcher are always built automatically
# as workspace dependencies of `codex-plus-app` (and can be tested directly with `-p`).
default-members = [
  "crates/codex-plus-app",
  "crates/codex-plus-devkit",
  "crates/claude-patcher-rs",
  "crates/codex-wechat-rs",
  "crates/remote-control-rs/remote-control-p0",
  "crates/renderer-inject-rs",
  "crates/manager-models/manager-common-rs",
  "crates/manager-models/manager-core-rs",
  "crates/canvas-wasm/canvas-common-rs",
  "crates/canvas-wasm/canvas-core-rs",
  "crates/share-site-rs",
  "crates/rice-maid-pet-rs",
]
# Individual `rust-anything` gate unit crates keep their own `[workspace]` so
# `rust-anything gate` continues to validate each unit in isolation.
exclude = [
  "crates/devkit-units",
  "crates/native-browser-inspector-rs",
  "crates/remote-control-rs/remote-follower-patches-rs",
  "crates/remote-control-rs/remote-ipc-versions-rs",
  "crates/manager-models/auto-compact-rs",
  "crates/manager-models/code-highlight-rs",
  "crates/manager-models/overview-model-rs",
  "crates/manager-models/provider-name-rs",
  "crates/manager-models/theme-mode-rs",
]

[workspace.package]
version = "2.8.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/OrgGem/codex-plus-rust"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
directories = "6"
fs2 = "0.4"
http = "1"
httpdate = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.8"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

# Windows MinGW GNU shim for sherpa-onnx (avoids MSVC /MT static C++ .lib link incompatibility).
[patch.crates-io]
sherpa-onnx = { path = "crates/codex-plus-app/sherpa-onnx-gnu-shim" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "symbols"
lto = "thin"
