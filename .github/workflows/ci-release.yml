name: CI & Standalone Rust Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run Pure-Rust workspace tests
        run: cargo test --target x86_64-pc-windows-gnu
      - name: Check WASM cores compile cleanly
        run: cargo check --target wasm32-unknown-unknown -p manager-core-rs -p renderer-inject-rs -p canvas-core-rs -p share-site-rs -p rice-maid-pet-rs
      - name: Build Windows portable release & smoke-check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build-release.ps1 -SkipTests
      - name: Upload Windows portable bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CodexPlusPlus-Rust-win-x64
          path: release-bundle/*.zip

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test
      - name: Build macOS release bundle
        run: ./build-release.sh --skip-tests
      - name: Upload macOS bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CodexPlusPlus-Rust-macos
          path: release-bundle/
