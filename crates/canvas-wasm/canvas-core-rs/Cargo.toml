[package]
name = "canvas-core-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Unified pure-Rust + WASM core for tools/conversation-canvas (all sync, Map/Set, crypto, SSE, history paginator, and userscript bundler)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canvas-common-rs = { path = "../canvas-common-rs" }
getrandom = { version = "0.2", features = ["js"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
url = "2"
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
