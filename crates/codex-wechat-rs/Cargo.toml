[package]
name = "codex-wechat-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Pure-Rust port of tools/codex-wechat/codex_wechat.py (iLink WeChat <-> codex app-server/exec)"

[[bin]]
name = "codex-wechat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
