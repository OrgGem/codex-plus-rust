[package]
name = "log-view-model-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `src/log-view-model.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
manager-common-rs = { path = "../manager-common-rs" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_thread_local = "allow"

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
