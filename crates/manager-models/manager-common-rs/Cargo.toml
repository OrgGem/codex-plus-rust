[package]
name = "manager-common-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Shared JS coercion, UTF-16, date, i18n/preset assets, and domain helpers for manager-models ports"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
url = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
