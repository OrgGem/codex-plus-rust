[package]
name = "github-repository-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `src/github-repository.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
url = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_thread_local = "allow"

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
