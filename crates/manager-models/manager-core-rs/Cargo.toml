[package]
name = "manager-core-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Unified Rust/WASM library covering all remaining codex-plus-manager logic units and js_only boundaries"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
fancy-regex = "0.14"
manager-common-rs = { path = "../manager-common-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
unicode-script = "0.5"
wasm-bindgen = "0.2"

[dev-dependencies]
auto-compact-rs = { path = "../auto-compact-rs" }
code-highlight-rs = { path = "../code-highlight-rs" }
overview-model-rs = { path = "../overview-model-rs" }
provider-name-rs = { path = "../provider-name-rs" }
theme-mode-rs = { path = "../theme-mode-rs" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
