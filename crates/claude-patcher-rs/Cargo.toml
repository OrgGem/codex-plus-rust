[package]
name = "claude-patcher-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Pure-Rust build-copy, sign-copy, and inject-cn CLI for Claude localization"

[[bin]]
name = "claude-patcher"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"
ureq = "2"
tungstenite = "0.24"
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
