[package]
name = "inspect-service-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `inspect-service.mjs`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
oxc_allocator = "0.160"
oxc_parser = { version = "0.160", default-features = false }
oxc_ast = "0.160"
oxc_semantic = "0.160"
oxc_span = "0.160"
oxc_syntax = "0.160"
sha2 = "0.10"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_thread_local = "allow"

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
