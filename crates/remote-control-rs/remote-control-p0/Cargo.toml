[package]
name = "remote-control-p0"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Pure-Rust port of tools/remote-control-p0 (ASAR version extractor, IPC router client, ThreadFollower, sidecar app-server, mock-responses server, and P0-P5 runners)"

[[bin]]
name = "remote-control-p0"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace]
