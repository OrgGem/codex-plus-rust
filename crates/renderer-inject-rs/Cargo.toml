[package]
name = "renderer-inject-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Pure-Rust & WASM core for assets/inject/renderer-inject shards (prompt-args, statsig-overrides, model-catalog, picker-groups, extension sanitizers)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fancy-regex = "0.14"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
url = "2"
wasm-bindgen = "0.2"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
